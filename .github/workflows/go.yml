name: Go

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build-32-bit:
    name: Build linux/${{ matrix.goarch }}${{ matrix.goarm }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: '386'
            goarm: ''
          - goarch: arm
            goarm: '6'
          - goarch: arm
            goarm: '7'
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: Build all packages
        run: go build ./...
      - name: Compile all tests
        # Cross-compiled binaries cannot run on the host; true skips execution.
        run: go test -exec=true -run='^$' ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TIMESCALE_FACTOR: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Check module files
        run: go mod tidy -diff
      - name: Configure UDP socket buffers
        if: runner.os == 'Linux'
        # https://github.com/quic-go/quic-go/wiki/UDP-Buffer-Sizes
        run: sudo sysctl -w net.core.rmem_max=7500000 net.core.wmem_max=7500000
      - name: Test
        run: go test -race -count=1 -p=1 ./...
      - name: Vet
        run: go vet ./...
